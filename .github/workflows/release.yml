# Canonical multi-platform release builder.
# Triggered by v* tags or manual dispatch. Builds Windows/Linux/Android installers
# in parallel, then publishes all artifacts to a GitHub Release.
name: Build Kastrava releases

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APK'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows installers'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux packages'
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  windows:
    if: ${{ inputs.build_windows != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - name: Build premium bundle
        run: npm run build:prod
        env:
          KAS_API: https://api.kastrava.in
          KAS_STORE: https://kastrava.in
      - name: Package Windows installers (unsigned)
        run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Kastrava-win
          path: |
            release/Kastrava-Setup-*.exe
            release/Kastrava-*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
      - name: Get version
        id: get-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

  linux:
    if: ${{ inputs.build_linux != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - run: sudo apt-get update && sudo apt-get install -y fakeroot rpm zstd libarchive-tools
      - run: npm ci --no-audit --no-fund
      - name: Build premium bundle
        run: npm run build:prod
        env:
          KAS_API: https://api.kastrava.in
          KAS_STORE: https://kastrava.in
      - name: Package Linux (deb / rpm / AppImage / pacman)
        run: npx electron-builder --linux deb rpm AppImage pacman --x64 --publish never
      - name: Convert pacman artifact to .pkg.tar.zst
        run: |
          v=$(node -p "require('./package.json').version")
          if ls release/*.pacman >/dev/null 2>&1; then
            xz -dc release/*.pacman | zstd -3 -o "release/kastrava-${v}-1-x86_64.pkg.tar.zst"
          fi
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: Kastrava-linux
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/kastrava-*.pkg.tar.zst
            release/latest-linux.yml
            release/*.blockmap
          if-no-files-found: error
      - name: Get version
        id: get-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

  android:
    if: ${{ inputs.build_android != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore release keystore
        run: |
          mkdir -p keystore
          if [ -n "${{ secrets.ANDROID_KS_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KS_B64 }}" | base64 -d > keystore/kastrava-release.jks
            echo "release keystore restored"
          else
            echo "no keystore secret — release will be debug-signed (do not ship)"
          fi
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
        env:
          KASTRAVA_KS_FILE: ${{ github.workspace }}/android/keystore/kastrava-release.jks
          KASTRAVA_KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          KASTRAVA_KEY_ALIAS: kastrava
      - name: Rename APKs to release filenames
        run: |
          v=$(node -p "require('../package.json').version")
          cp app/build/outputs/apk/std/release/app-std-release.apk "Kastrava-${v}.apk"
          cp app/build/outputs/apk/ru/release/app-ru-release.apk "Kastrava-ru-${v}.apk"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: Kastrava-android
          path: android/Kastrava-*.apk
          if-no-files-found: error
      - name: Get version
        id: get-version
        run: echo "version=$(node -p "require('../package.json').version")" >> $GITHUB_OUTPUT

  publish:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Kastrava ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/Kastrava-win/*
            artifacts/Kastrava-linux/*
            artifacts/Kastrava-android/*
          generate_release_notes: true
